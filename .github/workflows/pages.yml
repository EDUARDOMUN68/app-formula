name: Publicar APP FORMULA
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Actualizar datos oficiales]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Preparar solo archivos de la app
        run: |
          mkdir public
          cp index.html app.js logic.js styles.css manifest.json sw.js icon.svg icon-192.png icon-512.png public/
          cp -r data public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
